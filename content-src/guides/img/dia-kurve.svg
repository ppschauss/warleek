<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="688" viewBox="0 0 1024 688" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="1024" height="688" fill="#161c18"/>

  <!-- Legende oben, damit nichts auf den Linien liegt -->
  <g font-size="23">
    <line x1="60" y1="46" x2="104" y2="46" stroke="#c7b58f" stroke-width="4"/>
    <text x="118" y="54" fill="#c7b58f">Empfindlichkeit 1.0 – volle Drehrate, zappelig um die Mitte</text>

    <line x1="60" y1="84" x2="104" y2="84" stroke="#e0843a" stroke-width="4" stroke-dasharray="10 8"/>
    <text x="118" y="92" fill="#e0843a">Regler auf 0.3 – ruhiger, aber die Drehrate fehlt oben</text>

    <path d="M60,122 C74,122 90,118 104,114" fill="none" stroke="#9be15d" stroke-width="5"/>
    <text x="118" y="130" fill="#9be15d">Kurve im Stick-Treiber – fein in der Mitte, voll am Anschlag</text>
  </g>

  <!-- Feinarbeitsbereich -->
  <rect x="150" y="470" width="210" height="140" fill="#9be15d" opacity="0.07"/>
  <text x="255" y="428" fill="#9be15d" font-size="21" text-anchor="middle">Schweben, Landen,</text>
  <text x="255" y="452" fill="#9be15d" font-size="21" text-anchor="middle">Zielen</text>

  <!-- Hilfsraster -->
  <g stroke="#1f2822" stroke-width="1">
    <line x1="150" y1="470" x2="900" y2="470"/>
    <line x1="150" y1="330" x2="900" y2="330"/>
    <line x1="150" y1="190" x2="900" y2="190"/>
    <line x1="360" y1="610" x2="360" y2="180"/>
    <line x1="570" y1="610" x2="570" y2="180"/>
    <line x1="750" y1="610" x2="750" y2="180"/>
  </g>

  <!-- Achsen -->
  <g stroke="#8a938c" stroke-width="2">
    <line x1="150" y1="610" x2="910" y2="610"/>
    <line x1="150" y1="610" x2="150" y2="180"/>
  </g>

  <!-- Kurven -->
  <line x1="150" y1="610" x2="900" y2="190" stroke="#c7b58f" stroke-width="4"/>
  <line x1="150" y1="610" x2="900" y2="430" stroke="#e0843a" stroke-width="4" stroke-dasharray="10 8"/>
  <path d="M150,610 C430,600 650,470 900,190" fill="none" stroke="#9be15d" stroke-width="5"/>

  <!-- Die fehlende Drehrate markieren -->
  <line x1="900" y1="430" x2="900" y2="190" stroke="#e0843a" stroke-width="2" stroke-dasharray="4 6"/>
  <text x="916" y="316" fill="#e0843a" font-size="22">fehlt</text>
  <circle cx="900" cy="190" r="9" fill="#9be15d"/>
  <circle cx="900" cy="430" r="8" fill="#e0843a"/>

  <!-- Achsentexte -->
  <text x="530" y="662" fill="#8a938c" font-size="25" text-anchor="middle">Ausschlag am Stick</text>
  <text x="-395" y="42" fill="#8a938c" font-size="25" text-anchor="middle" transform="rotate(-90)">Drehrate des Helikopters</text>
  <text x="150" y="642" fill="#8a938c" font-size="21" text-anchor="middle">Mitte</text>
  <text x="900" y="642" fill="#8a938c" font-size="21" text-anchor="middle">Anschlag</text>
</svg>
